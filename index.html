<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="Capture and share kindergarten learning observations, aligned to the Ontario Kindergarten Program frames." />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />

    <!-- Browser tab icon. "?v=3" makes browsers fetch the new icon instead of a cached one;
         bump the number whenever the icon changes. -->
    <link rel="icon" href="./favicon.ico?v=3" sizes="48x48" />
    <link rel="icon" type="image/png" sizes="32x32" href="./favicon-32.png?v=3" />
    <link rel="icon" type="image/png" sizes="16x16" href="./favicon-16.png?v=3" />

    <!-- iOS "Add to Home Screen" (iOS rounds the corners itself) -->
    <link rel="apple-touch-icon" sizes="180x180" href="./apple-touch-icon.png?v=3" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="K-Doc" />

    <!-- Android / Chrome "Add to Home Screen" -->
    <link rel="manifest" href="./manifest.webmanifest?v=3" />
    <meta name="theme-color" content="#1d4ed8" />

    <title>K-Doc</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
